name: test

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches-ignore:
      - "**/graphite-base/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: ARK Resolver Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/ci-setup
      - run: just test
      - run: just pytest
      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.setup.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.setup.outputs.repo-cache-key }}
  smoke:
    name: ARK Resolver Smoke-Test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    env:
      # Dependabot PRs run unreviewed upstream code (including bumped actions),
      # so they must never receive the Docker Hub token, which is also the
      # image publish credential. The security workflow still audits their
      # dependencies, and publish.yml scans the image after merge.
      RUN_DOCKER_SCOUT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: setup
        uses: ./.github/actions/ci-setup
      - uses: docker/setup-compose-action@v1
      - run: just smoke-test
      # //:image_push's stamped remote tag is otherwise first exercised on
      # merge to main; catch drift here without ever running image_push.
      - run: just image-tag-check
      - name: Log in to Docker Hub
        if: env.RUN_DOCKER_SCOUT == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: 'Docker Scout: compare to production'
        if: env.RUN_DOCKER_SCOUT == 'true'
        uses: docker/scout-action@v1
        with:
          command: compare
          image: local://daschswiss/ark-resolver:latest
          to-env: production
          ignore-unchanged: true
          only-severities: critical,high
          write-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          organization: daschswiss
      - name: 'Docker Scout: CVE report (SARIF)'
        if: env.RUN_DOCKER_SCOUT == 'true'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://daschswiss/ark-resolver:latest
          sarif-file: scout-results.sarif
          organization: daschswiss
      - name: Upload SARIF to GitHub Security
        if: env.RUN_DOCKER_SCOUT == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: scout-results.sarif
      - name: Save Bazel repository cache
        if: ${{ !cancelled() && steps.setup.outputs.repo-cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/bazel-repo
          key: ${{ steps.setup.outputs.repo-cache-key }}
