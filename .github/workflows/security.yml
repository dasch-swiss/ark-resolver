name: security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]
    branches-ignore:
      - "**/graphite-base/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # cargo itself ships preinstalled on GitHub's ubuntu-latest runner image
      # (see actions/runner-images); only cargo-audit needs installing here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: just audit

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This job has no Bazel work, so it sets up uv directly instead of via
      # ci-setup/action.yml. Keep this version pin in sync with the one there.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.28"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Export requirements from uv.lock
        run: uv export --format requirements-txt --no-hashes --no-dev > /tmp/requirements.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: "/tmp/requirements.txt"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
