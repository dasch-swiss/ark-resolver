name: CI setup
description: >
  Provisions the Bazel CI environment: bazelisk, uv, just, and the Bazel
  repository cache. Consumed by every workflow job that runs a Bazel-driven
  `just` recipe.

outputs:
  repo-cache-key:
    description: >
      Primary key of the Bazel repository cache restore. Feed it to the
      caller's end-of-job `actions/cache/save` step.
    value: ${{ steps.repo-cache.outputs.cache-primary-key }}
  repo-cache-hit:
    description: >
      'true' when the restore hit the primary key exactly; the caller's save
      step should skip then (saving an existing key is a no-op warning).
    value: ${{ steps.repo-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # bazelisk honours .bazelversion; setup-bazel's own caches are disabled
    # below so the explicit repository-cache restore/save pair is the only one.
    - uses: bazel-contrib/setup-bazel@0.19.0
      with:
        bazelisk-cache: false
        disk-cache: false
        repository-cache: false
        external-cache: false

    - uses: extractions/setup-just@v3

    # Keep this version pin in sync with the separate one in
    # .github/workflows/security.yml's pip-audit job (it has no Bazel work,
    # so it does not use this action).
    - uses: astral-sh/setup-uv@v5
      with:
        version: "0.11.28"
        enable-cache: true

    # restore-only: the combined actions/cache action saves only when the job
    # succeeds, so each caller saves at its own end under `!cancelled()`.
    # A save step also can't live here: composite actions have no post step,
    # so it would run before the calling job's Bazel work finishes, saving a
    # stale cache. Callers with a matching "Save Bazel repository cache" step:
    # check.yml (x2), test.yml (x2), publish.yml (x1).
    - name: Restore Bazel repository cache
      id: repo-cache
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/bazel-repo
        key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock') }}
        restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-
